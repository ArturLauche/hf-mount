name: Windows

# CI for the Windows edition, runnable in any public fork on GitHub-hosted
# runners (no private runners, registries or secrets). A green run means:
# Linux/Windows lint + unit tests passed, and the WinFsp drive-letter
# integration tests passed against the real driver on a Windows runner.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux lint & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (no features)
        run: cargo clippy -- -D warnings

      - name: Clippy (FUSE + NFS)
        run: cargo clippy --features fuse,nfs -- -D warnings

      - name: Clippy (lib tests)
        run: cargo clippy --lib --profile test -- -D warnings

      - name: Unit tests
        run: cargo test --lib --features fuse,nfs

  windows:
    name: Windows build, tests & WinFsp mount tests
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Clippy (lib + lib tests)
        run: |
          cargo clippy --lib -- -D warnings
          cargo clippy --lib --profile test -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      # The mount tests run even when an earlier test step failed, so every
      # run reports both; the job still fails if any step failed.
      - name: Install WinFsp (pinned, SHA-256 verified)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/windows/install-winfsp.ps1 -Quiet

      - name: WinFsp drive-letter integration tests
        timeout-minutes: 20
        if: ${{ !cancelled() }}
        run: cargo test --lib -- --ignored --test-threads=1 windows::mount_tests

      - name: Build release CLI
        if: ${{ !cancelled() }}
        run: cargo build --release --bin hf-mount

      - name: CLI smoke tests (argument handling and exit codes)
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $exe = "target/release/hf-mount.exe"
          function Expect([int]$code, [string[]]$a) {
            & $exe @a | Out-Host
            if ($LASTEXITCODE -ne $code) { throw "hf-mount $a exited $LASTEXITCODE, expected $code" }
          }
          Expect 0 @('--version')
          Expect 0 @('--help')
          Expect 0 @('--json', 'status')
          Expect 0 @('--json', 'drives')
          Expect 0 @('--json', 'doctor')
          Expect 9 @('stop', 'Q:')
          Expect 2 @('start', 'repo', '../x', 'H:')
          Expect 2 @('start', 'repo', 'a/b', 'C:')
          Expect 2 @('start', 'bucket', 'only-one-segment', 'H:')
          # A repository that does not exist: anonymous access gets 401 from
          # the Hub (not found or private) -> auth_required (4).
          & $exe --json start repo hf-mount-ci/this-repo-does-not-exist-0000 Q: | Out-Host
          if ($LASTEXITCODE -ne 4 -and $LASTEXITCODE -ne 5) { throw "missing repo exited $LASTEXITCODE" }

      - name: Live end-to-end mount of a public repository
        timeout-minutes: 20
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/windows/smoke-test.ps1 -Exe target/release/hf-mount.exe

      - name: Upload hf-mount logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-mount-logs-windows
          path: ~\AppData\Local\hf-mount\logs
          if-no-files-found: ignore
