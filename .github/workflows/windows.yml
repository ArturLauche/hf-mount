name: Windows

# CI for the Windows edition, runnable in any public fork on GitHub-hosted
# runners (no private runners, registries or secrets). A green run means:
# Linux/Windows lint + unit tests passed, the WinFsp drive-letter integration
# tests passed against the real driver on a Windows runner, a public
# repository was mounted end to end, the desktop UI passed its checks, and
# the installers were built, installed, started and uninstalled.
# windows-release.yml reuses this workflow to build release assets.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      HF_TOKEN:
        description: Token for the opt-in private repository and bucket smoke tests
        required: false
    outputs:
      cli-artifact-id:
        description: Portable Windows CLI archive
        value: ${{ jobs.cli.outputs.artifact-id }}
      desktop-artifact-id:
        description: Windows NSIS and MSI installers
        value: ${{ jobs.desktop.outputs.artifact-id }}

concurrency:
  # Use the PR merge ref (unique across forks) or the pushed branch. A tag or
  # manual run gets its own group, and a caller has a different workflow ref.
  group: windows-build-${{ github.workflow_ref }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux lint & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (no features)
        run: cargo clippy --locked -- -D warnings

      - name: Clippy (FUSE + NFS)
        run: cargo clippy --locked --features fuse,nfs -- -D warnings

      - name: Clippy (lib tests)
        run: cargo clippy --locked --lib --profile test -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib --features fuse,nfs

      - name: FUSE directory paging through the kernel
        run: |
          sudo modprobe fuse
          echo 'user_allow_other' | sudo tee -a /etc/fuse.conf
          cargo test --locked --lib --features fuse,nfs kernel_directory_stream_survives_remote_mutation -- --ignored

  windows:
    name: Windows build, tests & WinFsp mount tests
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # Keep file/line information for test failures with smaller debug artifacts.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # Keep each debug target separate from the release compilation caches.
          workspaces: |
            . -> target
            desktop/src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}

      - name: Clippy (lib + lib tests)
        run: |
          cargo clippy --locked --lib -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --lib --profile test -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib

      # The mount tests run even when an earlier test step failed, so every
      # run reports both; the job still fails if any step failed.
      - name: Install WinFsp (pinned, SHA-256 verified)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/windows/install-winfsp.ps1 -Quiet

      - name: WinFsp drive-letter integration tests
        timeout-minutes: 20
        if: ${{ !cancelled() }}
        run: cargo test --locked --lib -- --ignored --test-threads=1 windows::mount_tests

      - name: Clippy (desktop app)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: |
          $env:TAURI_CONFIG = Get-Content src-tauri/tauri.ci-build.conf.json -Raw
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Upload WinFsp test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-mount-logs-windows
          path: ~\AppData\Local\hf-mount\logs
          if-no-files-found: ignore

  cli:
    name: Windows portable CLI and smoke tests
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        id: rust-cache
        with:
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}

      - name: Build release CLI
        id: build
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cargo build --locked --release --bin hf-mount
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item target/release/hf-mount.exe
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "### Windows CLI" >> $env:GITHUB_STEP_SUMMARY
          "- Cargo build: $($timer.Elapsed.ToString('mm\:ss')) (exact Rust cache hit: $env:CACHE_HIT)" >> $env:GITHUB_STEP_SUMMARY
          "- hf-mount.exe: $($exe.Length) bytes, SHA-256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Package portable CLI
        run: ./scripts/windows/package-cli.ps1 -Exe target/release/hf-mount.exe -OutDir dist

      - name: Upload portable CLI
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-mount-cli-windows-x64
          path: dist/*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Install WinFsp (pinned, SHA-256 verified)
        run: ./scripts/windows/install-winfsp.ps1 -Quiet

      - name: CLI smoke tests (argument handling and exit codes)
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $exe = "target/release/hf-mount.exe"
          function Expect([int]$code, [string[]]$a) {
            & $exe @a | Out-Host
            if ($LASTEXITCODE -ne $code) { throw "hf-mount $a exited $LASTEXITCODE, expected $code" }
          }
          Expect 0 @('--version')
          Expect 0 @('--help')
          Expect 0 @('--json', 'status')
          Expect 0 @('--json', 'drives')
          Expect 0 @('--json', 'doctor')
          Expect 9 @('stop', 'Q:')
          Expect 2 @('start', 'repo', '../x', 'H:')
          Expect 2 @('start', 'repo', 'a/b', 'C:')
          Expect 2 @('start', 'bucket', 'only-one-segment', 'H:')
          # A repository that does not exist: anonymous access gets 401 from
          # the Hub (not found or private) -> auth_required (4).
          & $exe --json start repo hf-mount-ci/this-repo-does-not-exist-0000 Q: | Out-Host
          if ($LASTEXITCODE -ne 4 -and $LASTEXITCODE -ne 5) { throw "missing repo exited $LASTEXITCODE" }
          # The expected non-zero code above must not become the step's result.
          exit 0

      - name: Live end-to-end mount of a public repository
        timeout-minutes: 20
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/windows/smoke-test.ps1 -Exe target/release/hf-mount.exe

      - name: Upload hf-mount logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-mount-logs-windows-cli
          path: ~\AppData\Local\hf-mount\logs
          if-no-files-found: ignore

  frontend:
    name: Desktop UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm test

  desktop-build:
    name: Compile Windows desktop app
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        id: rust-cache
        with:
          workspaces: desktop/src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Fetch the official WinFsp installer (SHA-256 verified, unmodified)
        run: ./scripts/windows/install-winfsp.ps1 -DownloadTo desktop/src-tauri/resources/winfsp

      - name: License lists for the installer (Rust crates, npm packages)
        run: >
          ./scripts/windows/dependency-licenses.ps1
          -Manifest desktop/src-tauri/Cargo.toml
          -NpmLock desktop/package-lock.json
          -OutDir desktop/src-tauri/resources/licenses

      # Tauri's beforeBuildCommand builds the production UI once. The CI override
      # defers adding the CLI sidecar until bundling, so the two Rust builds overlap.
      - name: Build Tauri app and production UI
        working-directory: desktop
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          npm run tauri -- build --ci --no-bundle --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.ci-build.conf.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item src-tauri/target/release/hf-mount-desktop.exe
          "### Windows desktop build" >> $env:GITHUB_STEP_SUMMARY
          "- Tauri build including frontend: $($timer.Elapsed.ToString('mm\:ss')) (exact Rust cache hit: $env:CACHE_HIT)" >> $env:GITHUB_STEP_SUMMARY
          "- hf-mount-desktop.exe: $($exe.Length) bytes" >> $env:GITHUB_STEP_SUMMARY

      # Transfer only the app, generated resources and lockfile-installed Tauri
      # CLI. The packaging runner needs neither a second npm install nor Cargo's target cache.
      - name: Upload desktop build inputs
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-mount-desktop-build-inputs
          path: |
            desktop/src-tauri/target/release/hf-mount-desktop.exe
            desktop/src-tauri/resources/licenses/
            desktop/src-tauri/resources/winfsp/
            desktop/node_modules/@tauri-apps/cli/
            desktop/node_modules/@tauri-apps/cli-win32-x64-msvc/
          retention-days: 7
          if-no-files-found: error

  desktop:
    name: Desktop app installers (NSIS + MSI)
    needs: [cli, desktop-build]
    # Surface a failed producer in the installer check as well.
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Require successful Windows builds
        if: ${{ needs.cli.result != 'success' || needs.desktop-build.result != 'success' }}
        run: throw 'Both the CLI and desktop builds must succeed before bundling'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bundler uses cargo metadata to locate the build output.
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download desktop build inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.desktop-build.outputs.artifact-id }}
          path: desktop

      - name: Download portable CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: cli

      - name: Stage the verified CLI sidecar
        env:
          CLI_SHA256: ${{ needs.cli.outputs.sha256 }}
        run: |
          $zip = Get-ChildItem cli/*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath cli/unpacked
          $exe = 'cli/unpacked/hf-mount.exe'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash -ne $env:CLI_SHA256) {
            throw 'Portable CLI does not match the executable built and tested in this run'
          }
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item -LiteralPath $exe -Destination desktop/src-tauri/binaries/hf-mount-x86_64-pc-windows-msvc.exe

      - name: Bundle NSIS and MSI installers
        working-directory: desktop
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          node node_modules/@tauri-apps/cli/tauri.js bundle --ci --config src-tauri/tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) { throw 'Expected exactly one NSIS and one MSI installer' }
          "### Windows installer packaging" >> $env:GITHUB_STEP_SUMMARY
          "- Tauri bundle: $($timer.Elapsed.ToString('mm\:ss'))" >> $env:GITHUB_STEP_SUMMARY
          "- NSIS: $($nsis[0].Length) bytes" >> $env:GITHUB_STEP_SUMMARY
          "- MSI: $($msi[0].Length) bytes" >> $env:GITHUB_STEP_SUMMARY

      - name: Install, start and uninstall the app
        env:
          CLI_SHA256: ${{ needs.cli.outputs.sha256 }}
        run: |
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          ./scripts/windows/desktop-install-test.ps1 -Installer $setup.FullName -CliSha256 $env:CLI_SHA256

      - name: Upload installers
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-mount-desktop-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          compression-level: 0
          if-no-files-found: error

      - name: Upload app logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-mount-desktop-logs
          path: ~\AppData\Local\hf-mount\logs
          if-no-files-found: ignore

  authenticated:
    name: Opt-in private repository and bucket write test
    # Runs only where the repository owner configured a test bucket and/or a
    # private repository (Settings > Variables) and the HF_TOKEN secret; it is
    # skipped for pull requests from forks, which get no secrets. The bucket test only
    # touches a new folder it creates and removes.
    if: >-
      ${{ (vars.HF_MOUNT_TEST_BUCKET != '' || vars.HF_MOUNT_TEST_PRIVATE_REPO != '')
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [windows, cli]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact-id }}
          path: cli

      - name: Unpack CLI and install WinFsp
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem cli/*.zip | Select-Object -First 1).FullName -DestinationPath cli/unpacked
          ./scripts/windows/install-winfsp.ps1 -Quiet

      - name: Private repository and bucket round trip
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST_BUCKET: ${{ vars.HF_MOUNT_TEST_BUCKET }}
          TEST_PRIVATE_REPO: ${{ vars.HF_MOUNT_TEST_PRIVATE_REPO }}
        run: |
          $exe = (Get-ChildItem -Recurse cli/unpacked -Filter hf-mount.exe | Select-Object -First 1).FullName
          $testArgs = @{ Exe = $exe }
          if ($env:TEST_BUCKET) { $testArgs.Bucket = $env:TEST_BUCKET }
          if ($env:TEST_PRIVATE_REPO) { $testArgs.PrivateRepo = $env:TEST_PRIVATE_REPO }
          ./scripts/windows/authenticated-test.ps1 @testArgs
