[package]
name = "hf-mount"
version = "0.6.5"
edition = "2024"
license = "Apache-2.0"
description = "Mount Hugging Face Buckets and repos as a local filesystem using FUSE or NFS"
repository = "https://github.com/huggingface/hf-mount"
keywords = ["fuse", "nfs", "huggingface", "filesystem", "mount"]
categories = ["filesystem", "command-line-utilities"]

[dependencies]
# xet-core crates
xet-client = { git = "https://github.com/huggingface/xet-core.git", branch = "main" }
xet-core-structures = { git = "https://github.com/huggingface/xet-core.git", branch = "main" }
xet-data = { git = "https://github.com/huggingface/xet-core.git", branch = "main" }
xet-runtime = { git = "https://github.com/huggingface/xet-core.git", branch = "main" }

# External crates
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
futures = "0.3"
libc = "0.2"
nfsserve = { version = "0.11", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = "1"
uuid = { version = "1", features = ["v4"] }
cap-std = "4"
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow"] }

[features]
default = []
fuse = ["dep:fuser"]
gui = ["dep:eframe"]
nfs = ["dep:nfsserve"]
vendored-openssl = ["openssl-sys/vendored"]

# fuser is Unix-only (Linux/macOS FUSE bindings). Windows builds support the
# NFS backend only.
[target.'cfg(unix)'.dependencies]
fuser = { version = "0.17", optional = true }

[dependencies.openssl-sys]
version = "0.9"
optional = true

[[bin]]
name = "hf-mount-fuse"
path = "src/bin/hf-mount-fuse.rs"
required-features = ["fuse"]

[[bin]]
name = "hf-mount-nfs"
path = "src/bin/hf-mount-nfs.rs"
required-features = ["nfs"]

[[bin]]
name = "hf-mount-gui"
path = "src/bin/hf-mount-gui/main.rs"
required-features = ["nfs", "gui"]

[[bin]]
name = "hf-mount"
path = "src/bin/hf-mount.rs"

[[bin]]
name = "hf-mount-fuse-sidecar"
path = "src/bin/hf-mount-fuse-sidecar.rs"
required-features = ["fuse"]

[dev-dependencies]
tempfile = "3"

# Pin fuser to the HF fork until cberner/fuser merges Session::from_fds
# (sidecar with externally pre-cloned fds — see #94).
[patch.crates-io]
fuser = { git = "https://github.com/huggingface/fuser.git", branch = "sidecar-multi-fd" }
nfsserve = { path = "vendor/nfsserve" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

